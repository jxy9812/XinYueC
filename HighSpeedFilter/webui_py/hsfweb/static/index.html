<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互嵌深层高速过滤机</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body data-density="normal">

<!-- 登录视图（覆盖层；登录成功后隐藏） -->
<div id="login-view" class="login-view hidden"></div>

<!-- 应用外壳：标题栏 / 导航 / 内容 / 状态栏 -->
<div id="app-shell" class="app-shell hidden">
  <header id="title-bar" class="title-bar"></header>
  <nav id="nav-panel" class="nav-panel"></nav>
  <main id="page-host" class="page-host"></main>
  <footer id="status-bar" class="status-bar"></footer>
</div>

<!-- 抽屉导航遮罩（仅窄屏 ≤860px 出现；点一下关抽屉） -->
<div id="nav-scrim" class="nav-scrim"></div>

<!-- 弹出菜单层（账户菜单等；点别处收） -->
<div id="popup-layer" class="popup-layer hidden"></div>

<!--
  脚本全部本地、无构建步骤：经典 <script>，全局命名空间 window.HSF。
  加载顺序即依赖顺序（prefs 最先——其它模块读缩放偏好；app 最后装配）。
-->
<script src="js/prefs.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/sse.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/titlebar.js"></script>
<script src="js/navbar.js"></script>
<script src="js/statusbar.js"></script>
<script src="js/login.js"></script>
<script src="js/trendchart.js"></script>
<script src="js/pages/placeholder.js"></script>
<script src="js/pages/menu-page.js"></script>
<script src="js/pages/data_toolbar.js"></script>
<script src="js/pages/page00_home.js"></script>
<script src="js/pages/page01.js"></script>
<script src="js/pages/page02.js"></script>
<script src="js/pages/page03.js"></script>
<script src="js/pages/page04.js"></script>
<script src="js/pages/page05.js"></script>
<script src="js/pages/page06.js"></script>
<script src="js/pages/page07.js"></script>
<script src="js/pages/page08.js"></script>
<script src="js/pages/page09_history.js"></script>
<script src="js/pages/page10_log.js"></script>
<script src="js/pages/page11_alarm.js"></script>
<script src="js/pages/page12.js"></script>
<script src="js/pages/page13_local.js"></script>
<script src="js/pages/page14_remote.js"></script>
<script src="js/pages/page15_network.js"></script>
<!-- [2026-11-19 相机页] 页号 17（16 是保留槽位=桌面端的 Web 设置页，
     网页端不实现 ⇒ 两端页号逐号对齐）；画面经服务端采集后由 webui 组帧，
     浏览器用 <img> 取 /api/camera/frame。 -->
<script src="js/pages/page17_camera.js"></script>
<!-- [2026-11-22 页 6 拆分] 页 18「流量」：电磁流量计 + 进水泵 + 流量趋势
     （页号追加末尾；页 6 只留水质/浊度）。 -->
<script src="js/pages/page18_flow.js"></script>
<!-- [2026-11-13 三页合并] 原「悬浮窗设置(16)」与「窗口设置(17)」两页已并入
     页 13「本地设置」（三个分区：界面设置 / 悬浮窗 / 窗口与屏幕），
     两个脚本随之删除、页数 18 → 16。 -->
<script src="js/app.js"></script>
</body>
</html>
